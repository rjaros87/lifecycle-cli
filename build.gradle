plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.9'
}

version = '1.0.0'
group = 'io.github.rjaros87'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.toVersion('25')
    targetCompatibility = JavaVersion.toVersion('25')
}

dependencies {
    // Generates META-INF/native-image/**/reflect-config.json for every class
    // referenced by a picocli @Command/@Option/@Mixin (constructors, fields).
    // Without this, native-image has no reflection metadata for e.g.
    // LifecycleCommand's no-arg constructor, and picocli fails at runtime with
    // "Cannot instantiate ...: the class has no constructor". This is
    // independent of any DI framework - plain picocli needs it too.
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    implementation 'info.picocli:picocli:4.7.7'

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.rjaros87.lifecycle.LifecycleCommand'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Required by picocli-codegen: tells it where/how to group the generated
// native-image config files under META-INF/native-image/<project>/.
compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

// GraalVM Native Image build configuration.
// --static --libc=musl produces a fully static executable, so it can be
// copied into ANY distroless image (e.g. gcr.io/distroless/static)
// without needing glibc in the target layer.
// GraalVM Native Image build configuration.
graalvmNative {
    binaries {
        main {
            imageName = 'lifecycle'
            mainClass = 'io.github.rjaros87.lifecycle.LifecycleCommand'
            def isAmd64 = System.getProperty("os.arch") in ["amd64", "x86_64"]
            
            def arch = System.getProperty('os.arch')
            def isArm = arch == 'aarch64' || arch == 'arm64'
        
            // amd64: fully static (musl) - zero runtime dependencies, works on
            // literally any base image, including FROM scratch.
            // arm64: GraalVM's musl toolchain is documented as Linux-AMD64-only
            // (and GitHub's arm64 runner provisioning for it is currently broken
            // anyway - see conversation history / CI logs). Fall back to
            // --static-nolibc ("mostly static": everything statically linked
            // except libc, dynamically linked against the system's glibc).
            // This needs a glibc-based target image for the arm64 binary
            // specifically (Chainguard/Wolfi, gcr.io/distroless/base-debian12 -
            // NOT scratch, NOT a musl-based image like Alpine).
            buildArgs.addAll(
                '--no-fallback',
                '--enable-url-protocols=http'
            )
            buildArgs.addAll(isArm ? ['--static-nolibc'] : ['--static', '--libc=musl'])
        }
    }
}
